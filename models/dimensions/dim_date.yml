version: 2

models:
  - name: dim_date
    description: Conformed Date Dimension. One row per day of the year.
    columns:
      - name: datekey
        description: The surrogate key of the date in YYYYMMDD format
        tests:
          - not_null
          - unique

      - name: date
        description: The actual calendar date
        tests:
          - not_null
          - unique